<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>雲嘉月報表系統</title>
<meta name="description" content="自動抓取雲嘉眾召會每週人數報表，依主日日期彙整成月報表" />
<meta name="theme-color" content="#2563eb" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="雲嘉月報" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="wrap">
  <header class="app-header">
    <div class="app-header-row">
      <div>
        <h1>雲嘉月報表系統</h1>
      </div>
    </div>
  </header>

  <div class="source-bar">
    <div class="source-info">
      <span>資料來源：<a id="source-link" href="#" target="_blank" rel="noopener">讀取中…</a></span>
      <span class="source-time" id="source-time"></span>
    </div>
    <div class="source-actions">
      <button class="btn-secondary" id="refresh-btn">重新抓取</button>
    </div>
  </div>
  <div class="status-msg" id="status-msg"></div>

  <div id="app-main" style="display:none;">

  <section class="card">
    <h2>報表設定</h2>
    <div class="settings-grid">
      <div class="field">
        <label>月份</label>
        <div class="chip-grid" id="month-picker"></div>
      </div>
      <div class="field">
        <label for="cutoff-select">統計到</label>
        <select id="cutoff-select"></select>
      </div>
      <div class="field">
        <label for="preset-select">範本</label>
        <div class="preset-row">
          <select id="preset-select"></select>
          <button class="icon-btn" id="preset-rename-btn" title="範本改名" aria-label="範本改名"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
          <button class="icon-btn danger" id="preset-delete-btn" title="刪除範本" aria-label="刪除範本"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg></button>
          <button class="icon-btn" id="preset-new-btn" title="新增範本（清空項目重新挑選）" aria-label="新增範本"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg></button>
          <button class="icon-btn" id="preset-undo-btn" title="取消新增，回到原本的設定" aria-label="取消新增" hidden><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
          <button class="icon-btn" id="preset-save-btn" title="儲存範本（沿用名稱＝更新，改名＝另存新範本）" aria-label="儲存範本"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/></svg></button>
        </div>
        <p class="field-hint preset-note" id="preset-note"></p>
      </div>
    </div>

    <div class="field">
      <label>顯示選項</label>
      <div class="check-row">
        <label class="check"><input type="checkbox" data-setting="showRatio" /> 佔比</label>
        <label class="check"><input type="checkbox" data-setting="compare" /> 較上月增減</label>
      </div>
    </div>

    <div class="field">
      <label>項目 <span class="field-hint" id="picked-count"></span></label>
      <div class="picked-bar">
        <div class="chip-grid" id="picked-chips"></div>
        <div class="picked-tools">
          <button class="btn-secondary" id="picker-toggle">編輯項目</button>
        </div>
      </div>
      <div class="picker-panel" id="field-picker" hidden>
        <div class="picker-tabs" id="picker-tabs"></div>
        <div id="picker-body"></div>
      </div>
    </div>
  </section>

  <section class="card report-card">
    <h2><span id="report-title">月報表</span></h2>
    <p class="report-sub" id="report-sub"></p>
    <div class="table-scroll">
      <table class="report-table" id="report-table"></table>
    </div>
    <div class="empty-hint" id="report-empty" style="display:none;">請至少勾選一個項目</div>
    <div class="card-actions">
      <button class="btn-primary" id="download-btn">下載 Excel</button>
    </div>
  </section>


  </div>
</div>

<script src="js/xlsx.core.min.js"></script>
<script src="js/report.js"></script>
<script src="js/app.js"></script>
</body>
</html>
