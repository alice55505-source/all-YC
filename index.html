<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>雲嘉月報表系統</title>
<meta name="description" content="自動抓取雲嘉眾召會每週人數報表，依主日日期彙整成月報表" />
<meta name="theme-color" content="#2563eb" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="雲嘉月報" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="wrap">
  <header class="app-header">
    <div class="app-header-row">
      <div>
        <h1>雲嘉月報表系統</h1>
        <p>自動抓取每週人數報表，依主日日期歸月，自選項目產生月報表。</p>
      </div>
    </div>
  </header>

  <div class="source-bar">
    <div class="source-info">
      <span>資料來源：<a id="source-link" href="#" target="_blank" rel="noopener">讀取中…</a></span>
      <span class="source-time" id="source-time"></span>
    </div>
    <div class="source-actions">
      <button class="btn-secondary" id="refresh-btn">重新抓取</button>
    </div>
  </div>
  <div class="status-msg" id="status-msg"></div>

  <div id="app-main" style="display:none;">

  <section class="card">
    <h2>報表設定</h2>
    <div class="settings-grid">
      <div class="field">
        <label>月份 <span class="field-hint">可多選，並排比較</span></label>
        <div class="chip-grid" id="month-picker"></div>
      </div>
      <div class="field">
        <label for="cutoff-select">統計到 <span class="field-hint">月份資料還不完整時，可選要算到哪一週</span></label>
        <select id="cutoff-select"></select>
      </div>
      <div class="field">
        <label for="preset-select">範本</label>
        <div class="inline-row">
          <select id="preset-select"></select>
          <button class="btn-secondary" id="preset-save-btn" title="把目前的設定存成新範本">存成新範本</button>
        </div>
        <div class="preset-actions" id="preset-actions" hidden>
          <span class="preset-dirty" id="preset-dirty" hidden>設定已變更，尚未存入範本</span>
          <button class="link-btn" id="preset-update-btn">用目前設定更新此範本</button>
          <button class="link-btn" id="preset-rename-btn">改名</button>
          <button class="link-btn danger" id="preset-delete-btn">刪除</button>
        </div>
        <p class="field-hint preset-note" id="preset-note"></p>
      </div>
    </div>

    <div class="field">
      <label>顯示選項</label>
      <div class="check-row">
        <label class="check"><input type="checkbox" data-setting="showRatio" /> 佔比</label>
        <label class="check"><input type="checkbox" data-setting="compare" /> 較上月增減</label>
      </div>
    </div>

    <div class="field">
      <label>項目 <span class="field-hint" id="picked-count"></span><span class="field-hint">・按住拖曳可調整順序</span></label>
      <div class="picked-bar">
        <div class="chip-grid" id="picked-chips"></div>
        <div class="picked-tools">
          <button class="btn-secondary" id="picker-toggle">＋ 編輯項目</button>
        </div>
      </div>
      <div class="picker-panel" id="field-picker" hidden>
        <div class="picker-tabs" id="picker-tabs"></div>
        <div id="picker-body"></div>
      </div>
    </div>
  </section>

  <section class="card report-card">
    <h2><span id="report-title">月報表</span> <span class="badge" id="report-badge"></span></h2>
    <p class="report-sub" id="report-sub"></p>
    <div class="table-scroll">
      <table class="report-table" id="report-table"></table>
    </div>
    <div class="empty-hint" id="report-empty" style="display:none;">請至少勾選一個項目</div>
    <div class="card-actions">
      <button class="btn-primary" id="download-btn">下載 Excel</button>
    </div>
  </section>

  <footer class="app-footer">
    週報分頁名稱是主日日期（例如 1004 = 10/4 主日，涵蓋 9/28～10/4），月份依主日日期歸屬。
    週平均只計算有填資料的週；某小區有缺週時，數字旁會標示實際回報週數。
    基數、名冊、受浸目標與累計取當月最後一週；本月受浸 = 本月底累計 − 上月底累計。
  </footer>

  </div>
</div>

<script src="js/xlsx.core.min.js"></script>
<script src="js/report.js"></script>
<script src="js/app.js"></script>
</body>
</html>
